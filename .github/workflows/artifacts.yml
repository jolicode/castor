name: Artifacts

on:
  push:
    branches: [ main ]

# Every push on main rebuilds and republishes the snapshot: build one run at a
# time and keep only the latest queued one. A running build is never
# cancelled, it may be uploading to the release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The build jobs attest their artifacts, only the snapshot job needs to write
# to the repository (see below)
permissions:
  contents: read
  id-token: write # zizmor: ignore[excessive-permissions]
  attestations: write # zizmor: ignore[excessive-permissions]

jobs:
  phars:
    name: Create phars and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags are needed to compute the snapshot version
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          composer-flags: --no-dev

      - uses: ./.github/actions/phar

      - name: Attest the phars provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tools/phar/build/castor.*.phar

      - name: Upload the Linux phar (linux-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-amd64.phar
          path: tools/phar/build/castor.linux-amd64.phar
          if-no-files-found: error


      - name: Upload the Linux phar (linux-arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-arm64.phar
          path: tools/phar/build/castor.linux-arm64.phar
          if-no-files-found: error

      - name: Upload the Darwin phar (darwin-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-amd64.phar
          path: tools/phar/build/castor.darwin-amd64.phar
          if-no-files-found: error

      - name: Upload the Darwin phar (darwin-arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-arm64.phar
          path: tools/phar/build/castor.darwin-arm64.phar
          if-no-files-found: error

      - name: Upload the Windows phar (windows-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.windows-amd64.phar
          path: tools/phar/build/castor.windows-amd64.phar
          if-no-files-found: error

  static:
    needs: phars
    name: Create ${{ matrix.target }} static binary and upload
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # A target failing must not cancel the other ones
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          - target: darwin-amd64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
          # static-php-cli looks for Visual Studio 2019 or 2022, windows-latest
          # ships 2026
          - target: windows-amd64
            runs-on: windows-2022
            suffix: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: ./.github/actions/cache
        with:
          target: ${{ matrix.target }}

      - name: retrieve phar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tools/phar/build
          merge-multiple: true

      - uses: ./.github/actions/static
        with:
          os: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the static binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./castor.${{ matrix.target }}${{ matrix.suffix }}

      - name: Upload the ${{ matrix.target }} static binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.${{ matrix.target }}${{ matrix.suffix }}
          path: ./castor.${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error

  checksums:
    needs: [phars, static]
    name: Publish the checksums of the artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # One "<sha256>  <file name>" line per artifact, verified by the
      # installer and by self-update against the downloaded binary
      - name: Compute the checksums
        run: |
          set -e
          sha256sum castor.* > SHA256SUMS
          cat SHA256SUMS
        working-directory: artifacts

      - name: Attest the checksums provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/SHA256SUMS

      - name: Upload the checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  snapshot:
    needs: [checksums]
    name: Publish the snapshot pre-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # zizmor: ignore[excessive-permissions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Retrieve all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the artifacts to the snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(git describe --tags --match 'v*')
          notes="Snapshot of the main branch, built from ${GITHUB_SHA}. Install it with \`--version=snapshot\` or \`castor self-update --snapshot\`."
          if gh release view snapshot >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/snapshot" -f sha="${GITHUB_SHA}" -F force=true
            gh release edit snapshot --prerelease --title "${version}" --notes "${notes}"
          else
            gh release create snapshot --target "${GITHUB_SHA}" --prerelease --title "${version}" --notes "${notes}"
          fi
          gh release upload snapshot artifacts/* --clobber
