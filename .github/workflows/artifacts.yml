name: Artifacts

on:
  push:
    branches: [ main ]

permissions:
  contents: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]
  attestations: write # zizmor: ignore[excessive-permissions]

jobs:
  phars:
    name: Create phars and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags are needed to compute the snapshot version
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          composer-flags: --no-dev

      - uses: ./.github/actions/phar

      - name: Attest the phars provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tools/phar/build/castor.*.phar

      - name: Upload the Linux phar (linux-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-amd64.phar
          path: tools/phar/build/castor.linux-amd64.phar
          if-no-files-found: error


      - name: Upload the Linux phar (linux-arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-arm64.phar
          path: tools/phar/build/castor.linux-arm64.phar
          if-no-files-found: error

      - name: Upload the Darwin phar (darwin-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-amd64.phar
          path: tools/phar/build/castor.darwin-amd64.phar
          if-no-files-found: error

      - name: Upload the Darwin phar (darwin-arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-arm64.phar
          path: tools/phar/build/castor.darwin-arm64.phar
          if-no-files-found: error

      - name: Upload the Windows phar (windows-amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor-windows-amd64.phar
          path: tools/phar/build/castor.windows-amd64.phar
          if-no-files-found: error

  static-linux-amd64:
    needs: phars
    name: Create Linux amd64 static binary and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: ./.github/actions/cache
        with:
          target: linux-amd64

      - name: retrieve phar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tools/phar/build
          merge-multiple: true

      - uses: ./.github/actions/static
        with:
          os: linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the static binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./castor.linux-amd64

      - name: Upload the Linux amd64 static binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-amd64
          path: ./castor.linux-amd64
          if-no-files-found: error

  static-linux-arm64:
    needs: phars
    name: Create Linux arm64 static binary and upload
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: ./.github/actions/cache
        with:
          target: linux-arm64

      - name: retrieve phar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tools/phar/build
          merge-multiple: true

      - uses: ./.github/actions/static
        with:
          os: linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the static binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./castor.linux-arm64

      - name: Upload the Linux arm64 static binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.linux-arm64
          path: ./castor.linux-arm64
          if-no-files-found: error

  static-darwin-amd64:
    needs: phars
    name: Create MacOs amd64 static binary and upload
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: ./.github/actions/cache
        with:
          target: darwin-amd64

      - name: retrieve phar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tools/phar/build
          merge-multiple: true

      - uses: ./.github/actions/static
        with:
          os: darwin-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the static binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./castor.darwin-amd64

      - name: Upload the MacOs amd64 static binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-amd64
          path: ./castor.darwin-amd64
          if-no-files-found: error

  static-darwin-arm64:
    needs: phars
    name: Create MacOs arm64 static binary and upload
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: ./.github/actions/cache
        with:
          target: darwin-arm64

      - name: retrieve phar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tools/phar/build
          merge-multiple: true

      - uses: ./.github/actions/static
        with:
          os: darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the static binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./castor.darwin-arm64

      - name: Upload the MacOs arm64 static binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castor.darwin-arm64
          path: ./castor.darwin-arm64
          if-no-files-found: error

  snapshot:
    needs: [phars, static-linux-amd64, static-linux-arm64, static-darwin-amd64, static-darwin-arm64]
    name: Publish the snapshot pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Retrieve all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the artifacts to the snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(git describe --tags --match 'v*')
          notes="Snapshot of the main branch, built from ${GITHUB_SHA}. Install it with \`--version=snapshot\` or \`castor self-update --snapshot\`."
          if gh release view snapshot >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/snapshot" -f sha="${GITHUB_SHA}" -F force=true
            gh release edit snapshot --prerelease --title "${version}" --notes "${notes}"
          else
            gh release create snapshot --target "${GITHUB_SHA}" --prerelease --title "${version}" --notes "${notes}"
          fi
          gh release upload snapshot artifacts/* --clobber
