name: Restore the PHP build cache
description: Restore the static PHP build artifacts cache of a target

inputs:
  target:
    description: The system to restore the cache for (linux-amd64, linux-arm64, darwin-amd64 or darwin-arm64), or "test" for the compile test
    required: true

runs:
  using: composite
  steps:
    - name: Get the cache key
      shell: bash
      id: get-cache-key
      env:
        INPUTS_TARGET: ${{ inputs.target }}
      run: |
        set -e

        if [ "${INPUTS_TARGET}" = test ]; then
          # Should be the same command as the one in CompileCommandTest
          cache_dirname=$(tests/bin/compile-get-cache-key phar-location-is-not-used-in-cache-key --os linux --php-extensions filter,mbstring,phar,posix,tokenizer)
        else
          cache_dirname=$(bin/castor castor:static:cache-dir "${INPUTS_TARGET}")
        fi

        echo "cache_dirname=${cache_dirname}" >> "$GITHUB_OUTPUT"
        echo "cache_key=$(basename "${cache_dirname}")" >> "$GITHUB_OUTPUT"

    - name: Restore PHP static building artifacts cache for ${{ inputs.target }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ steps.get-cache-key.outputs.cache_dirname }}
        key: php-static-${{ steps.get-cache-key.outputs.cache_key }}
