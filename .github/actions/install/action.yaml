name: Install dependencies
description: Install dependencies for the project and the phar builder

inputs:
  php-version:
    description: The PHP version to use
    required: true
    default: '8.4'
  composer-flags:
    description: Install dev dependencies
    required: false
    default: ''
  need_phar:
    description: Install phar dependencies
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
      with:
        php-version: '${{ inputs.php-version }}'
        coverage: none

    - name: Get the Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      shell: bash

    # The cached archives do not depend on the platform, so every job shares
    # the same cache
    - name: Restore the Composer cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('composer.lock', 'tools/phar/composer.lock') }}
        restore-keys: composer-

    - name: Install dependencies (project)
      run: composer install --prefer-dist --no-progress --optimize-autoloader --classmap-authoritative ${INPUTS_COMPOSER_FLAGS}
      shell: bash
      env:
        INPUTS_COMPOSER_FLAGS: ${{ inputs.composer-flags }}

    - name: Install dependencies (phar builder)
      run: composer install --prefer-dist --no-progress --optimize-autoloader --classmap-authoritative
      shell: bash
      working-directory: tools/phar
      if: ${{ inputs.need_phar == 'true' }}
